name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docs:
    name: Docs lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Docs lint (line length, dangling links)
        run: bash scripts/docs-lint/lint.sh
      - name: Docs lint tests
        run: bash scripts/docs-lint/lint.test.sh

  daemon:
    name: Daemon (vet, test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: daemon
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: daemon/go.mod
          cache-dependency-path: daemon/go.sum
      - name: go mod tidy is up to date
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - run: go vet -tags=dev ./...
      - run: go test -tags=dev ./...
      # The release workflow builds the daemon on macos-latest, so a
      # Linux-only syscall compiles fine here and breaks at tag time instead of
      # in review — the same trap the desktop job guards against below.
      # Cross-compiling costs seconds and catches it in the PR.
      - name: Cross-compile for the release targets
        run: |
          GOOS=darwin GOARCH=arm64 go build ./...

  desktop:
    name: Desktop shell (vet, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.sum
      - name: go mod tidy is up to date
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      # ./internal/... is pure Go, so it vets and tests without a system webview.
      - run: go vet ./internal/...
      - run: go test ./internal/...
      # cmd/homeshell-desktop needs CGO and WebKitGTK, and otherwise only ever
      # compiles in the release workflow — where a break is found at tag time.
      - name: Install the webview toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev
      - name: Build the shell, asserting its webkit linkage
        working-directory: .
        run: make build-desktop

  webapp:
    name: Webapp (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          package_json_file: webapp/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: webapp/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm nx run-many -t lint typecheck test
      - run: pnpm nx build @homeshell/web

  build-and-e2e:
    name: Binary build & e2e (API + UI)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: daemon/go.mod
          cache-dependency-path: daemon/go.sum
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          package_json_file: webapp/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: webapp/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: webapp
      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('webapp/pnpm-lock.yaml') }}
      - run: pnpm --filter @homeshell/web-e2e exec playwright install --with-deps chromium
        working-directory: webapp
      # Full artifact: web app built, embedded, compiled into bin/homeshell.
      - run: make build
      # Playwright starts the daemon (go run) and vite itself; CI=true makes
      # it refuse to reuse stray servers.
      - run: make test-e2e
      - name: Upload Playwright output on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-output
          path: webapp/apps/web-e2e/test-output
          if-no-files-found: ignore
