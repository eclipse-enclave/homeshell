name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  docs:
    name: Docs lint and release scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Docs lint (line length, dangling links)
        run: bash scripts/docs-lint/lint.sh
      - name: Docs lint tests
        run: bash scripts/docs-lint/lint.test.sh
      - name: Release script tests
        run: bash scripts/release.test.sh

  daemon:
    name: Daemon (vet, test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: daemon
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: daemon/go.mod
          cache-dependency-path: daemon/go.sum
      - name: go mod tidy is up to date
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - run: go vet -tags=dev ./...
      - run: go test -tags=dev ./...
      # Releases build the daemon on macOS runners, so a Linux-only syscall
      # compiles fine here and breaks only in the release build. Cross-compiling
      # costs seconds and catches it in the PR.
      - name: Cross-compile for the release targets
        run: |
          GOOS=darwin GOARCH=arm64 go build ./...

  desktop:
    name: Desktop shell (vet, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.sum
      - name: go mod tidy is up to date
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      # ./internal/... is pure Go, so it vets and tests without a system webview.
      - run: go vet ./internal/...
      - run: go test ./internal/...
      # cmd/homeshell-desktop needs CGO and WebKitGTK, and otherwise only
      # compiles in the release builds.
      - name: Install the webview toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev
      - name: Build the shell, asserting its webkit linkage
        working-directory: .
        run: make build-desktop

  webapp:
    name: Webapp (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: webapp/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: webapp/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm nx run-many -t lint typecheck test
      - run: pnpm nx build @homeshell/web

  build-and-e2e:
    name: Binary build & e2e (API + UI)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: daemon/go.mod
          cache-dependency-path: daemon/go.sum
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: webapp/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: webapp/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: webapp
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('webapp/pnpm-lock.yaml') }}
      - run: pnpm --filter @homeshell/web-e2e exec playwright install --with-deps chromium
        working-directory: webapp
      # Full artifact: web app built, embedded, compiled into bin/homeshell.
      - run: make build
      # Playwright builds and starts the daemon and vite itself; CI=true makes
      # it refuse to reuse stray servers and retry failed tests twice.
      - run: make test-e2e
      # Lists failed and flaky (passed only on retry) tests, so a flake is
      # visible on a green run too.
      - name: Summarize e2e results
        if: always()
        working-directory: webapp/apps/web-e2e
        run: |
          report=test-output/results.json
          if [ ! -f "$report" ]; then
            echo "No e2e report: the run did not get to the tests." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          jq -r '
            def list($status):
              [.. | objects | select(has("specs")) | .specs[] as $spec
                | $spec.tests[] | select(.status == $status)
                | "- `\($spec.file):\($spec.line)` [\(.projectName)] \($spec.title)"]
              | if length == 0 then "none" else join("\n") end;
            "## e2e results",
            "",
            "\(.stats.expected) passed, \(.stats.flaky) flaky, \(.stats.unexpected) failed, \(.stats.skipped) skipped",
            "",
            "### Failed",
            "",
            list("unexpected"),
            "",
            "### Flaky (passed on retry)",
            "",
            list("flaky")
          ' "$report" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Playwright output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-output
          path: webapp/apps/web-e2e/test-output
          if-no-files-found: ignore
