name: Reusable Release Assets

# Builds everything a release publishes, for the rolling and the stable channel
# alike, and uploads it as one `release-assets` artifact: the standalone daemon
# archives (the only channel-stamped builds, so the only ones that update
# themselves), the Debian and RPM packages, the macOS disk images, and
# checksums.txt covering all of them.

on:
  workflow_call:
    inputs:
      channel:
        description: Release channel stamped into the standalone archives (rolling or stable).
        required: true
        type: string
      version:
        description: Version the artifacts must report, e.g. 1.0.0 for the tag v1.0.0; empty accepts the git-derived version.
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  # Built once: every Go build below embeds the same web UI.
  webapp:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: webapp/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          # A tag build must not restore a cache a branch could have written.
          cache: ${{ !startsWith(github.ref, 'refs/tags/') && 'pnpm' || '' }}
          cache-dependency-path: webapp/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
        working-directory: webapp

      - run: make build-webapp

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: webapp-dist
          path: webapp/apps/web/dist
          if-no-files-found: error
          retention-days: 1

  archive:
    needs: webapp
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            goos: linux
            goarch: amd64
            smoke: true
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            smoke: true
          - runner: macos-15
            goos: darwin
            goarch: arm64
            smoke: true
          # Cross-compiled on the arm64 macOS runner and therefore not smoke-tested.
          - runner: macos-15
            goos: darwin
            goarch: amd64
            smoke: false
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The version derives from the latest release tag.
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: daemon/go.mod
          cache-dependency-path: daemon/go.sum
          cache: ${{ !startsWith(github.ref, 'refs/tags/') }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: webapp-dist
          path: webapp/apps/web/dist

      - name: Build standalone archive
        run: make archive GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} BUILD_CHANNEL=${{ inputs.channel }}

      - name: Smoke test the archived binary
        if: ${{ matrix.smoke }}
        run: |
          tmp=$(mktemp -d)
          tar -xzf "dist/homeshell-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz" -C "$tmp"
          for file in homeshell README.md LICENSE NOTICE.md THIRD-PARTY-NOTICES.txt licenses/herdr/LICENSE; do
            test -f "$tmp/$file" || { echo "archive is missing $file" >&2; exit 1; }
          done
          want="$(./scripts/version.sh)"
          got="$("$tmp/homeshell" --version)"
          [ "$got" = "$want" ] || { echo "homeshell --version reports '$got', want '$want'" >&2; exit 1; }

      - name: Note skipped smoke test
        if: ${{ !matrix.smoke }}
        run: |
          echo "::notice::Smoke test skipped for homeshell-${{ matrix.goos }}-${{ matrix.goarch }} (cross-compiled on ${{ matrix.runner }})"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-part-archive-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/homeshell-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz
          if-no-files-found: error
          retention-days: 1

  # homeshell-desktop needs CGO and the WebKit framework, so it builds natively.
  dmg:
    needs: webapp
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: daemon/go.mod
          cache-dependency-path: |
            daemon/go.sum
            desktop/go.sum
          cache: ${{ !startsWith(github.ref, 'refs/tags/') }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: webapp-dist
          path: webapp/apps/web/dist

      - name: Build disk images
        run: |
          make dmg GOARCH=arm64
          make dmg GOARCH=amd64

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-part-dmg
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 1

  deb:
    needs: webapp
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: daemon/go.mod
          cache-dependency-path: |
            daemon/go.sum
            desktop/go.sum
          cache: ${{ !startsWith(github.ref, 'refs/tags/') }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y debhelper libwebkit2gtk-4.1-dev

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: webapp-dist
          path: webapp/apps/web/dist

      # deb-quick skips the Build-Depends check: Go comes from setup-go, not golang-go.
      - name: Build Debian package
        run: make deb-quick

      - name: Verify package contents
        run: |
          tmp=$(mktemp -d)
          dpkg-deb -x dist/homeshell_*.deb "$tmp"
          ./scripts/verify-package.sh "$tmp"

      - name: Install and remove the package
        run: |
          sudo apt-get install -y ./dist/homeshell_*.deb
          want="$(./scripts/version.sh)"
          got="$(homeshell --version)"
          [ "$got" = "$want" ] || { echo "homeshell --version reports '$got', want '$want'" >&2; exit 1; }
          sudo apt-get remove -y homeshell
          test ! -e /usr/bin/homeshell

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-part-deb
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 1

  # Built on Fedora, so the desktop links Fedora's WebKitGTK and glibc.
  rpm:
    needs: webapp
    runs-on: ubuntu-24.04
    container: fedora:44
    timeout-minutes: 20
    steps:
      # git first: without it, checkout downloads a tarball and version.sh has no tags.
      - name: Install build dependencies
        run: dnf install -y git golang make rpm-build gcc-c++ webkit2gtk4.1-devel cpio findutils tar gzip

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Trust checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: webapp-dist
          path: webapp/apps/web/dist

      - name: Build RPM package
        run: make rpm

      - name: Verify package contents
        run: |
          pkg=$(realpath dist/homeshell-*.x86_64.rpm)
          tmp=$(mktemp -d)
          (cd "$tmp" && rpm2cpio "$pkg" | cpio -idm --quiet)
          ./scripts/verify-package.sh "$tmp"

      - name: Install and remove the package
        run: |
          dnf install -y ./dist/homeshell-*.x86_64.rpm
          want="$(./scripts/version.sh)"
          got="$(homeshell --version)"
          [ "$got" = "$want" ] || { echo "homeshell --version reports '$got', want '$want'" >&2; exit 1; }
          dnf remove -y homeshell
          test ! -e /usr/bin/homeshell

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-part-rpm
          path: dist/*.rpm
          if-no-files-found: error
          retention-days: 1

  assemble:
    needs: [archive, dmg, deb, rpm]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-part-*
          path: artifacts
          merge-multiple: true

      # GitHub renames uploaded assets (scripts/github-asset-name.sh). The
      # packages take their published names here, before checksums.txt is
      # written, so the GitHub release and download.eclipse.org agree.
      - name: Normalize artifact names
        run: |
          for file in artifacts/*; do
            name="$(./scripts/github-asset-name.sh "${file##*/}")"
            [ "${file##*/}" != "$name" ] || continue
            if [ -e "artifacts/$name" ]; then
              echo "::error::${file##*/} and $name would both be published as $name" >&2
              exit 1
            fi
            mv "$file" "artifacts/$name"
          done

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum -- * > checksums.txt

      # A name GitHub would change leaves checksums.txt and download.eclipse.org
      # disagreeing with the GitHub release; fail here, before either channel
      # publishes anything.
      - name: Verify asset names
        run: |
          for file in artifacts/*; do
            name="${file##*/}"
            published="$(./scripts/github-asset-name.sh "$name")"
            if [ "$name" != "$published" ]; then
              echo "::error::$name would be renamed to $published by GitHub" >&2
              exit 1
            fi
          done

      - name: Verify reported versions
        env:
          EXPECTED: ${{ inputs.version }}
        run: |
          version="$(./scripts/version.sh)"
          package_version="$(./scripts/github-asset-name.sh "$(./scripts/version.sh --package)")"
          if [ -n "$EXPECTED" ] && [ "$version" != "$EXPECTED" ]; then
            echo "checkout derives version $version, but the release is $EXPECTED" >&2
            exit 1
          fi
          tmp=$(mktemp -d)
          tar -xzf artifacts/homeshell-linux-amd64.tar.gz -C "$tmp" homeshell
          reported="$("$tmp/homeshell" --version)"
          if [ "$reported" != "$version" ]; then
            echo "homeshell-linux-amd64 reports '$reported', want version $version" >&2
            exit 1
          fi
          ls "artifacts/homeshell_${package_version}-1_amd64.deb" \
            artifacts/homeshell-"${package_version}"-1.*x86_64.rpm \
            "artifacts/HomeShell-$version-arm64.dmg" "artifacts/HomeShell-$version-amd64.dmg"
          ls artifacts

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: artifacts/*
          # Publication retries must reuse the original bytes, not rebuild;
          # GitHub re-runs jobs for up to 30 days.
          retention-days: ${{ inputs.channel == 'stable' && 30 || 1 }}
