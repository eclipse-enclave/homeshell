# GoReleaser builds the cross-platform daemon binaries that the self-update
# flow (docs/ARCHITECTURE.md, "Self-update") consumes from GitHub Releases. The single
# checksums.txt it produces is what go-selfupdate's ChecksumValidator verifies
# each download against.
#
# Local dry run: `make package-linux`, which exports the absolute
# PKG_CONFIG_PATH the desktop build needs before calling
# `goreleaser release --snapshot --clean`. Validate the config alone with
# `goreleaser check`.
version: 2

project_name: homeshell

# The web UI must be built and copied into the embed directory before the Go
# binary is compiled, mirroring `make build`. GoReleaser handles the Go build
# itself, so we only need the webapp + embed-copy steps from the Makefile.
# `before.hooks` entries are plain command strings. The `- cmd:` mapping form
# that `builds[].hooks` accepts is not valid here, and GoReleaser rejects the
# whole config on it — so the release pipeline could not load at all. It went
# unnoticed because no tag has ever been pushed; `goreleaser check` catches it.
before:
  hooks:
    - make build-webapp
    - make embed

builds:
  - id: homeshell
    # The Go module lives in daemon/; main is relative to that directory.
    dir: daemon
    main: ./cmd/homeshell
    binary: homeshell
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

  - id: homeshell-linux-amd64
    # Identical to the `homeshell` build above, scoped to linux/amd64 only, so
    # the nfpms entry below can package the daemon binary for exactly the one
    # platform the desktop shell is also built for (see nfpms comment).
    dir: daemon
    main: ./cmd/homeshell
    binary: homeshell
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos:
      - linux
    goarch:
      - amd64

  - id: homeshell-desktop
    # The Go module lives in desktop/; main is relative to that directory.
    dir: desktop
    main: ./cmd/homeshell-desktop
    binary: homeshell-desktop
    env:
      - CGO_ENABLED=1
      # PKG_CONFIG_PATH is deliberately NOT set here; it is inherited from
      # whoever invokes GoReleaser (`make package-linux` locally, an `env:` on
      # the release workflow step in CI). It has to be an *absolute* path to
      # packaging/linux/pkgconfig, and only the caller knows one:
      #
      #   - GoReleaser has no template for the project root.
      #   - {{ .Env.PWD }} does not work — goreleaser-action is a JS action, so
      #     PWD comes from the runner process, and GoReleaser fails outright on
      #     a missing .Env key.
      #   - A relative path does not work either, verified by building: cgo runs
      #     pkg-config from neither the repo root nor `dir: desktop`, so both
      #     `packaging/...` and `../packaging/...` silently resolved to the
      #     system webkit2gtk-4.0 and produced a 4.0-linked binary.
      #
      # The post hook below is what stops that being silent.
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos:
      - linux
    goarch:
      - amd64
    hooks:
      # `make build-desktop` asserts the linkage after building, but this build
      # bypasses the Makefile — and this is the binary that ships, where a 4.0
      # link costs a broken install rather than a broken dev build. The Go build
      # cache ignores PKG_CONFIG_PATH (docs/DEV.md, "Desktop shell"), so a wrong link is
      # silent without this.
      post:
        - cmd: sh -c 'ldd "{{ .Path }}" | grep -q "libwebkit2gtk-4\.1" || { echo "{{ .Path }} does not link libwebkit2gtk-4.1:"; ldd "{{ .Path }}" | grep -i webkit; exit 1; }'

archives:
  - id: homeshell
    ids:
      - homeshell
    # Contains "_{os}_{arch}", which is how go-selfupdate locates the asset
    # for the running platform.
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    # Explicit files replace the default globs. Include the project license
    # and notices as well as the embedded Herdr manifests' Apache-2.0 license.
    files:
      - README.md
      - LICENSE
      - NOTICE.md
      - src: packaging/THIRD-PARTY-NOTICES.txt
        strip_parent: true
      - src: daemon/internal/detect/manifests/herdr/LICENSE
        dst: licenses/herdr
        strip_parent: true
    formats:
      - tar.gz

# A single checksum file for every asset; matches
# ChecksumValidator{UniqueFilename: "checksums.txt"} in the daemon.
checksum:
  name_template: checksums.txt
  algorithm: sha256

# Linux .deb/.rpm bundling both binaries, a desktop launcher entry, and an
# icon; declares the libwebkit2gtk-4.1 runtime dependency needed by
# homeshell-desktop (docs/ARCHITECTURE.md, "Desktop shell"). Scoped to the
# amd64-only build ids (homeshell-desktop is not built for arm64 yet, so an
# arm64 package would ship the daemon alone while still declaring the
# webkit dependency and a launcher pointing at a missing binary).
nfpms:
  - id: homeshell
    package_name: homeshell
    ids:
      - homeshell-linux-amd64
      - homeshell-desktop
    vendor: Eclipse Foundation
    homepage: https://github.com/eclipse-enclave/homeshell
    maintainer: HomeShell contributors <homeshell@eclipse.org>
    description: HomeShell — control plane for AI-assisted development (daemon + desktop app)
    license: MIT
    formats:
      - deb
      - rpm
    # The WebKitGTK runtime homeshell-desktop links against. The package name
    # differs per distro family, and a single `dependencies` list is applied to
    # every format — which put a Debian name in the .rpm and made it
    # uninstallable on Fedora/RHEL. Name it per format instead.
    dependencies:
      - libwebkit2gtk-4.1-0
    overrides:
      rpm:
        dependencies:
          - webkit2gtk4.1
    contents:
      - src: LICENSE
        dst: /usr/share/doc/homeshell/LICENSE
      - src: NOTICE.md
        dst: /usr/share/doc/homeshell/NOTICE.md
      - src: packaging/linux/homeshell.desktop
        dst: /usr/share/applications/homeshell.desktop
      - src: packaging/linux/homeshell.png
        dst: /usr/share/icons/hicolor/512x512/apps/homeshell.png
      # herdr's license and notice, as in the archives.
      - src: packaging/THIRD-PARTY-NOTICES.txt
        dst: /usr/share/doc/homeshell/THIRD-PARTY-NOTICES.txt
      - src: daemon/internal/detect/manifests/herdr/LICENSE
        dst: /usr/share/doc/homeshell/licenses/herdr/LICENSE

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  # eclipsesource/homeshell is detected from the git remote. Releases are
  # created as drafts so a maintainer can review before publishing.
  draft: true
  prerelease: auto
